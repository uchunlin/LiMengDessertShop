      <p>${p.desc}</p>
    </div>
  `;

});

// ----------- 🟡 把這些函式放在外面！ ----------------

function noStyles() {
  for (let i = 1; i <= 4; i++) {
    document.styleSheets[i].disabled = true;
  }
}

function reStyle(n) {
  noStyles();
  document.styleSheets[n + 1].disabled = false; // +1 因為 0 是 Google Fonts
}


function closeBlackdiv() {
  const blackdiv = document.getElementById("blackdiv");
  const stylediv = document.getElementById("stylediv");
  if (blackdiv) blackdiv.remove();
  if (stylediv) stylediv.remove();
}

function showStyle(n) {
  const blackdiv = document.createElement("div");
  blackdiv.style = "background-color:#000;position:absolute;width:100%;height:100%;top:0;opacity:0.5;";
  blackdiv.id = "blackdiv";
  blackdiv.onclick = closeBlackdiv;
  document.body.appendChild(blackdiv);

  const div = document.createElement("div");
  div.id = "stylediv";
  div.style = "background-color:#fff;padding:5px;position:absolute;top:100px;left:200px;right:200px;overflow:auto;font-family:monospace;white-space:pre;";
  div.textContent = document.getElementsByTagName("style")[n].innerHTML;
  document.body.appendChild(div);
}

// 預設啟用第一個樣式
reStyle(0);
